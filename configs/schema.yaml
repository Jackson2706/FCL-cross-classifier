# Journal simulation configuration defaults.
#
# These keys are intentionally not wired into system/main.py yet. Journal modules
# should read them with getattr(args, "<key>", <default>) so legacy JSON configs
# continue to follow the current Ours_v2 code path.

# Asynchronous task scheduling is disabled in the legacy path. The distribution
# value is retained as the future scheduler's default mode when async_mode is set.
async_mode: false
client_task_speed_distribution: fixed_groups
max_task_lag: 0
client_dropout_rate: 0.0
partial_participation_rate: 1.0
task_schedule_seed: 0

# Journal reliability, boundary-preservation, and robustness modules are opt-in.
reliability_mode: none
reliability_beta: 1.0
reliability_beta_entropy: 1.0
reliability_beta_bn: 1.0
reliability_trust_floor: 0.0
reliability_accept_threshold: 0.0
calibration_temperature: 1.0
ece_bins: 15

# Generator-side paper objective is opt-in. kd_weight defaults to the legacy
# kd value (0.5) when omitted; kd retains its inverse-temperature convention.
generator_distillation: false
kd_weight: 0.5
# Enabled-path stability guard; non-positive disables clipping but still checks finiteness.
generator_grad_clip: 10.0
boundary_mode: none
adv_epsilon: 0.03
pgd_steps: 3
# null uses adv_epsilon / 2.
pgd_alpha: null
lambda_adv: 1.0
# null uses the per-batch median d_BN; samples strictly below it are accepted.
density_tau: null
# Robust evaluation runs only when boundary_mode is active.
boundary_robust_eval: true
# Optional development cap applied per client/test-task; null evaluates all batches.
robust_eval_max_batches: null
robustness_mode: none

# All clients currently share one ResNet-18 model and use parameter averaging.
model_heterogeneity: false
client_model_pool:
  - resnet18
server_model: resnet18
aggregation_mode: fedavg
