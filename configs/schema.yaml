# Journal simulation configuration defaults.
#
# Journal modules read optional keys with safe defaults so legacy JSON configs
# continue to follow the current Ours_v2 code path.

# Optional experiment tracking. Disabled means no wandb import or service.
wandb:
  enabled: false
  mode: online
  project: FEDRUA-Journal
  entity: null
  group: null
  job_type: train
  name: null
  tags: []
  notes: null
  log_model: false
  watch_model: false
  log_gradients: false
  log_freq: 1
  log_generated_samples: false
  max_logged_images: 32
  privacy_safe_mode: true
  resume: allow

# Asynchronous task scheduling is disabled in the legacy path. The distribution
# value is retained as the future scheduler's default mode when async_mode is set.
async_mode: false
client_task_speed_distribution: fixed_groups
max_task_lag: 0
client_dropout_rate: 0.0
partial_participation_rate: 1.0
task_schedule_seed: 0

# Journal reliability, boundary-preservation, and robustness modules are opt-in.
reliability_mode: none
reliability_beta: 1.0
reliability_beta_entropy: 1.0
reliability_beta_bn: 1.0
reliability_trust_floor: 0.0
reliability_accept_threshold: 0.0
calibration_temperature: 1.0
ece_bins: 15
# Optional development/smoke cap per client and task; null evaluates all samples.
ece_max_batches: null

# Generator-side paper objective is opt-in. kd_weight defaults to the legacy
# kd value (0.5) when omitted; kd retains its inverse-temperature convention.
generator_distillation: false
kd_weight: 0.5
# Enabled-path stability guard; non-positive disables clipping but still checks finiteness.
generator_grad_clip: 10.0
boundary_mode: none
adv_epsilon: 0.03
pgd_steps: 3
# null uses adv_epsilon / 2.
pgd_alpha: null
lambda_adv: 1.0
# null uses the per-batch median d_BN; samples strictly below it are accepted.
density_tau: null
# Robust evaluation runs only when boundary_mode is active.
boundary_robust_eval: true
# Optional development cap applied per client/test-task; null evaluates all batches.
robust_eval_max_batches: null
# Read-only diagnostics run only for persisted runs (offlog=true). Every pass
# restores Python/NumPy/Torch RNG streams and all model train/eval flags.
boundary_diagnostics: false
boundary_margin_threshold: 0.0
boundary_margin_band: 0.1
boundary_histogram_bins: 20
boundary_histogram_range: [-5.0, 5.0]
boundary_diagnostic_samples_per_class: 32
boundary_prototype_samples_per_class: 32
boundary_diagnostic_max_batches: null
boundary_diagnostic_max_samples_per_batch: null
boundary_save_center_matrix: false
margin_target: 1.0
margin_lambda: 0.1
prototype_feature_layer: penultimate
robustness_mode: none
corrupted_client_fraction: 0.0
label_noise_rate: 0.0
upload_noise_std: 5.0
bn_noise_std: 0.0
malicious_confidence_attack: false
malicious_logit_value: 20.0
extreme_imbalance_majority_fraction: 0.95
single_class_expert_label: null
robustness_seed: null
# Heuristic, read-only warning signals; these provide no formal privacy claim.
privacy_proxies: false
memorization_tau: null
privacy_max_samples: 256

# Phase 6a supports the listed CIFAR classifiers. FedAvg requires a homogeneous
# pool whose architecture also matches server_model; cross-architecture
# distillation aggregation is reserved for Phase 6b.
model_heterogeneity: false
client_model_pool:
  - resnet18
server_model: resnet18
aggregation_mode: fedavg
# Distillation modes use one shared generator-produced transfer batch. In
# logit_distillation it is generated once and then fixed for the run; in
# synthetic_distillation it is refreshed from the consolidated generator.
client_distill_steps: 1
distill_transfer_size: 256
# Distillation temperature reuses the existing inverse-kd convention: 1 / kd
# when kd > 0, otherwise 2.0.
